data_dir: data/raw/NEU-DET
cache_dir: data/cache
image_size: 200
seed: 42
split: {val: 0.15, test: 0.15}
leakage: {phash_max_distance: 4}
features: {hog_ppc: 32, lbp: [[8, 1], [16, 2]], glcm_levels: 32}
lightgbm: {n_estimators: 400, learning_rate: 0.05, num_leaves: 31, subsample: 0.8, colsample_bytree: 0.5}
logreg: {C: 1.0, max_iter: 2000}
mlflow: {tracking_uri: "sqlite:///mlflow.db", experiment: "neu-det-baseline"}
